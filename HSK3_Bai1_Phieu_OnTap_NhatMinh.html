<!DOCTYPE html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK3 Bài 1 • Tiếng Trung Nhật Minh</title><style>
:root{--ink:#163e49;--teal:#087e83;--cream:#fff9ef}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px system-ui,Arial}main{max-width:1050px;margin:auto;padding:24px}header{background:var(--ink);color:white;padding:30px;border-radius:24px}h1{font-size:clamp(24px,4vw,38px);margin:8px 0}h2{margin-top:30px} .zh{font-family:"Microsoft YaHei","SimHei",sans-serif}header .zh{font-size:30px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:var(--teal);color:white}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e5a542;outline-offset:3px}.muted{color:#61757a}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:white;color:var(--ink);border:1px solid #d9e8e6;min-height:155px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;box-shadow:0 4px 12px #183c4910}.card .han{font-size:34px}.card .back{display:none}.card.open{background:#e3f4ee}.card.open .back{display:block}.card small{font-size:12px;color:#61757a}.pill{display:inline-block;background:#e1f0eb;padding:8px 12px;margin:4px;border-radius:9px;font-size:22px}.q{padding:20px;margin:14px 0;background:white;border:1px solid #d9e8e6;border-radius:16px}.prompt{font-size:23px;line-height:1.8;margin-bottom:12px}input,textarea{font:inherit;padding:12px;border:1px solid #aec9ca;border-radius:10px;width:100%;background:#fffefb}textarea{min-height:72px;resize:vertical}.answer{margin-top:12px;background:#edf7f3;padding:12px;border-radius:10px;line-height:1.7}.correct{border-left:5px solid #178264}.wrong{border-left:5px solid #d17828}.answer:empty{display:none}.self{font-size:15px;margin-top:8px}.self input{width:auto}.summary{padding:20px;background:#e1f0eb;border-radius:16px;margin:16px 0}progress{width:100%;accent-color:var(--teal)}footer{text-align:center;padding:30px}.warning{color:#a65d19} @media print{button,.toolbar,.cards,header p,progress{display:none}body{background:white}.q{break-inside:avoid}header{background:white;color:black}textarea{height:65px}}</style>
<main><header><small>TIẾNG TRUNG NHẬT MINH · PHIẾU ÔN TẬP</small><h1>HSK3 · BÀI 1</h1><div class="zh">我们机场接你</div><p>27 từ vựng · 15 điền từ · 8 sắp xếp · 12 câu dịch</p></header>
<h2>01 · Thẻ lật ôn tập từ vựng</h2><p class="muted">Bấm vào chữ Hán để hiện pinyin và nghĩa tiếng Việt; bấm lần nữa để ẩn.</p><div class="toolbar"><button id="all">Hiện tất cả</button><button id="hide">Ẩn tất cả</button></div><div id="cards" class="cards"></div><div class="toolbar"><button id="start">Bắt đầu làm bài ↓</button></div>
<div id="exercise"><h2>02 · Luyện tập</h2><label>Họ và tên học viên<input id="student" placeholder="Nhập họ tên..."></label><p id="progressText"></p><progress id="progress" max="35" value="0"></progress><div id="questions"></div><div class="toolbar"><button id="submit">Nộp bài & xem nhận xét</button><button id="reset">Làm lại bài tập</button><button id="print">In phiếu</button></div><div id="result" role="status"></div><p id="saveNotice" class="muted"></p></div><footer>Tiếng Trung Nhật Minh • Chăm chỉ mỗi ngày, tiến bộ từng bước</footer></main>
<script id="lesson-data" type="application/json">{"v": [["以为", "yǐwéi", "cho rằng, tưởng rằng"], ["像", "xiàng", "giống, giống như"], ["长", "zhǎng", "lớn lên, phát triển"], ["身高", "shēngāo", "chiều cao"], ["米", "mǐ", "mét"], ["瘦", "shòu", "gầy, ốm"], ["接", "jiē", "đón"], ["行李", "xíngli", "hành lý"], ["丢", "diū", "làm mất, bị mất"], ["箱子", "xiāngzi", "va li, hòm"], ["号码", "hàomǎ", "số, mã số"], ["好像", "hǎoxiàng", "dường như, có vẻ như"], ["重要", "zhòngyào", "quan trọng"], ["着急", "zháojí", "lo lắng, sốt ruột"], ["护照", "hùzhào", "hộ chiếu"], ["服务台", "fúwùtái", "quầy phục vụ"], ["应该", "yīnggāi", "nên"], ["站", "zhàn", "đứng"], ["中间", "zhōngjiān", "ở giữa"], ["短", "duǎn", "ngắn"], ["头发", "tóufa", "tóc"], ["年轻", "niánqīng", "trẻ, trẻ tuổi"], ["发现", "fāxiàn", "phát hiện, tìm thấy"], ["不见", "bú jiàn", "không thấy, mất tích"], ["照片", "zhàopiàn", "ảnh chụp"], ["帮助", "bāngzhù", "giúp đỡ"], ["带", "dài", "mang, dẫn, đưa"]], "sections": [{"name": "I. Điền từ vào chỗ trống", "hint": "Chọn từ trong ngân hàng. Mỗi từ dùng một lần.", "type": "cloze", "items": [["我____你已经回家了，没想到你还在学校。", "以为"], ["她长得很____她妈妈。", "像"], ["你的____是多少？", "身高"], ["他身高一____八。", "米"], ["他最近太忙了，比以前____了。", "瘦"], ["明天我去机场____你。", "接"], ["我的____太多了，一个人拿不动。", "行李"], ["我的电话号码你记住了吗？——记住了，你的____很好记。", "号码"], ["她今天没来上课，____生病了。", "好像"], ["这件事很____，我们一定要认真做。", "重要"], ["别____，我们还有时间。", "着急"], ["出国的时候，请带好你的____。", "护照"], ["有问题可以去____问问。", "服务台"], ["你生病了，____多休息。", "应该"], ["这张____是我们去年在机场拍的。", "照片"]]}, {"name": "II. Sắp xếp câu", "hint": "Sắp xếp tất cả các thành phần thành câu hoàn chỉnh.", "type": "order", "items": [["我 / 明天 / 去 / 机场 / 接 / 你", "我明天去机场接你。"], ["她 / 长得 / 很 / 像 / 她妈妈", "她长得很像她妈妈。"], ["那个 / 年轻人 / 站在 / 中间", "那个年轻人站在中间。"], ["他 / 的 / 头发 / 很 / 短", "他的头发很短。"], ["我 / 发现 / 我的 / 护照 / 不见了", "我发现我的护照不见了。"], ["请 / 帮助 / 我 / 找 / 箱子", "请帮助我找箱子。"], ["你 / 应该 / 带 / 一张 / 照片", "你应该带一张照片。"], ["我 / 以为 / 你 / 今天 / 不来 / 了", "我以为你今天不来了。"]]}, {"name": "III. Dịch Trung → Việt", "hint": "Viết bản dịch tiếng Việt phù hợp. Sau khi nộp, đối chiếu với đáp án tham khảo.", "type": "cv", "items": [["这个孩子长得很快。", "Đứa trẻ này lớn rất nhanh."], ["我把箱子丢了，现在很着急。", "Tôi làm mất va li rồi, bây giờ rất sốt ruột."], ["那个站在中间的人是我姐姐。", "Người đứng ở giữa kia là chị gái tôi."], ["她的头发很短，也很漂亮。", "Tóc của cô ấy rất ngắn, cũng rất đẹp."], ["你能帮助我找一下行李吗？", "Bạn có thể giúp tôi tìm hành lý một chút không?"], ["他好像不知道我的电话号码。", "Anh ấy hình như không biết số điện thoại của tôi."]]}, {"name": "IV. Dịch Việt → Trung", "hint": "Viết câu bằng chữ Hán. Sau khi nộp, đối chiếu với đáp án tham khảo.", "type": "vc", "items": [["Tôi tưởng hôm nay bạn không đến.", "我以为你今天不来了。"], ["Ngày mai tôi đi sân bay đón bạn.", "明天我去机场接你。"], ["Chiều cao của anh ấy là một mét tám.", "他的身高是一米八。"], ["Hộ chiếu rất quan trọng, đừng làm mất.", "护照很重要，别丢了。"], ["Tôi phát hiện va li của mình không thấy đâu nữa.", "我发现我的箱子不见了。"], ["Bạn nên đến quầy phục vụ hỏi một chút.", "你应该去服务台问一下。"]]}]}</script><script>
const D=JSON.parse(document.getElementById('lesson-data').textContent),$=id=>document.getElementById(id),key='NhatMinh_HSK3_Bai1_27Tu_v1';let submitted=false;const norm=s=>s.normalize('NFC').toLowerCase().replace(/[\s，。！？、,.!?；;：:]/g,'');
D.v.forEach(([h,p,m],i)=>{let b=document.createElement('button');b.className='card';b.setAttribute('aria-expanded','false');b.innerHTML='<span class="han zh">'+h+'</span><span class="back">'+p+'</span><span class="back">'+m+'</span><small>Bấm để lật thẻ</small>';b.onclick=()=>{b.classList.toggle('open');b.setAttribute('aria-expanded',b.classList.contains('open'))};$('cards').append(b)});
function flip(on){document.querySelectorAll('.card').forEach(b=>{b.classList.toggle('open',on);b.setAttribute('aria-expanded',on)})}$('all').onclick=()=>flip(true);$('hide').onclick=()=>flip(false);$('start').onclick=()=>$('exercise').scrollIntoView({behavior:'smooth'});
let flat=[];D.sections.forEach((s,si)=>{let sec=document.createElement('section');sec.innerHTML='<h2>'+s.name+'</h2><p class="muted">'+s.hint+'</p>';if(si===0){let bank=document.createElement('div');[...s.items.map(x=>x[1])].sort((a,b)=>a.localeCompare(b,'zh')).forEach(w=>{let e=document.createElement('span');e.className='pill zh';e.textContent=w;bank.append(e)});sec.append(bank)}s.items.forEach(([p,a],i)=>{let id=flat.length;flat.push({p,a,type:s.type});let q=document.createElement('div');q.className='q';q.id='q'+id;q.innerHTML='<div class="prompt '+(s.type==='vc'?'':'zh')+'">'+(i+1)+'. '+p+'</div><'+(s.type==='cloze'?'input':'textarea')+' id="a'+id+'" aria-label="'+s.name+' câu '+(i+1)+'" placeholder="Nhập câu trả lời..."></'+(s.type==='cloze'?'input':'textarea')+'><div class="answer" id="f'+id+'"></div>';sec.append(q)});$('questions').append(sec)});
function state(){return {student:$('student').value,answers:flat.map((_,i)=>$('a'+i).value)}}function update(){let n=flat.filter((_,i)=>$('a'+i).value.trim()).length;$('progress').value=n;$('progressText').textContent='Đã làm '+n+'/35 câu';try{localStorage.setItem(key,JSON.stringify(state()));$('saveNotice').textContent='Bài làm được tự lưu trên trình duyệt này.'}catch(e){$('saveNotice').textContent='Trình duyệt không cho phép lưu. Bạn vẫn có thể làm và nộp bài.'}}
function grade(){submitted=true;let exact=0;flat.forEach((q,i)=>{let el=$('f'+i),box=$('q'+i);el.replaceChildren();box.classList.remove('correct','wrong');if(['cloze','order'].includes(q.type)){let ok=norm($('a'+i).value)===norm(q.a);exact+=ok;box.classList.add(ok?'correct':'wrong');el.textContent=(ok?'✓ Đúng. ':'↻ Cần sửa. ')+'Đáp án: '+q.a}else{el.textContent='Đáp án tham khảo: '+q.a;let div=document.createElement('div');div.className='self';let label=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.id='self'+i;c.onchange=summary;label.append(c,document.createTextNode(' Tôi đã đối chiếu: câu trả lời đúng hoặc tương đương về nghĩa.'));div.append(label);el.append(div)}});summary();$('result').scrollIntoView({behavior:'smooth'})}
function summary(){let correct=flat.reduce((n,q,i)=>n+(['cloze','order'].includes(q.type)?+(norm($('a'+i).value)===norm(q.a)):0),0),self=document.querySelectorAll('.self input:checked').length;$('result').className='summary';$('result').textContent='Điền từ & sắp xếp: '+correct+'/23 câu đúng. Dịch: '+self+'/12 câu tự xác nhận đúng. Tổng kết hợp tự đánh giá: '+(correct+self)+'/35 câu ('+Math.round((correct+self)/35*100)+'/100). Phần dịch có nhiều cách diễn đạt đúng; hãy nhờ giáo viên kiểm tra nếu chưa chắc.'}
$('submit').onclick=grade;$('reset').onclick=()=>{if(!confirm('Xóa bài làm hiện tại để làm lại?'))return;flat.forEach((_,i)=>{$('a'+i).value='';$('f'+i).replaceChildren();$('q'+i).classList.remove('correct','wrong')});$('result').replaceChildren();$('result').className='';submitted=false;update()};$('print').onclick=()=>window.print();$('exercise').addEventListener('input',e=>{if(e.target.matches('input:not([type=checkbox]),textarea')){if(submitted){submitted=false;flat.forEach((_,i)=>{$('f'+i).replaceChildren();$('q'+i).classList.remove('correct','wrong')});$('result').textContent='Bài làm đã thay đổi. Hãy nộp lại để cập nhật nhận xét.'}update()}});try{let s=JSON.parse(localStorage.getItem(key)||'null');if(s){$('student').value=s.student||'';(s.answers||[]).forEach((a,i)=>{if($('a'+i))$('a'+i).value=a})}}catch(e){}update();
</script></html>
